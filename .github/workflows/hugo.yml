name: Publikasi situs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # perlu untuk menyimpan alamat pendek dan halaman arsip otomatis
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - uses: actions/checkout@v4

      - name: Alamat pendek artikel baru dan halaman arsip
        run: python3 scripts/pra_build.py

      - name: Simpan hasilnya ke repositori (bila ada perubahan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if ! git diff --cached --quiet; then
            git commit -m "Otomatis: alamat pendek artikel dan arsip"
            git push
          fi

      - name: Pasang Hugo
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Indeks pencarian (Pagefind)
        run: npx --yes pagefind@1.3.0 --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
