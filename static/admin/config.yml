    - label: Kategori yang digabung
      name: kategori
      widget: select
      multiple: true
      options: *id001
  - name: inspirasi
    label: Semua Inspirasi
    file: content/inspirasi/_index.md
    fields:
    - label: Judul
      name: title
      widget: string
    - label: Layout
      name: layout
      widget: hidden
      default: gabungan
    - label: Kategori yang digabung
      name: kategori
      widget: select
      multiple: true
      options: *id001
- name: artikel
  label: Artikel
  label_singular: Artikel
  icon: newspaper
  description: Semua tulisan yang tampil di situs. Urutan bawaan tanggal terbaru di atas.
  folder: content/posts
  extension: md
  format: yaml-frontmatter
  create: true
  slug: '{{slug}}'
  summary: "{{title}} - {{date | date('DD MMM YYYY')}}"
  # Kolom pada daftar artikel (tampilan tabel).
  table_columns:
  - title
  - date
  - categories
  - draft
  # Urutan bawaan: tanggal terbaru di paling atas.
  sortable_fields:
    fields:
    - date
    - title
    - categories
    default:
      field: date
      direction: descending
  # Saringan cepat di atas daftar artikel.
  view_filters:
  - label: Terbit
    field: draft
    eq: false
  - label: Draf
    field: draft
    eq: true
  - label: Tahun ini
    field: date
    pattern: '^{{year}}'
  # Pengelompokan daftar per tahun (bisa dipilih di daftar artikel).
  view_groups:
  - label: Tahun
    field: date
    pattern: '\d{4}'
  fields:
  - label: Judul
    name: title
    widget: string
  - label: Alamat pendek (opsional, kosongkan agar dibuat otomatis dari judul)
    name: slug
    widget: string
    required: false
  # Alamat lama dari Blogger (contoh: /2015/10/judul-artikel.html).
  # Disembunyikan dari editor, tetapi WAJIB ada di daftar field: kalau tidak
  # dicantumkan, Sveltia akan membuang baris ini setiap kali artikel disimpan
  # dan tautan lama (termasuk hasil pencarian Google) menjadi mati.
  - label: Alamat lama (jangan diubah)
    name: url
    widget: hidden
  - label: Tanggal terbit
    name: date
    widget: datetime
  # Tanpa field ini, Sveltia membuang baris "draft" setiap kali artikel disimpan,
  # sehingga artikel draf bisa ikut tayang tanpa sengaja.
  - label: Draf (belum siap tayang)
    name: draft
    widget: boolean
    default: false
    required: false
    hint: Bila diaktifkan, artikel tidak muncul di situs.
  - label: Kategori
    name: categories
    widget: select
    multiple: true
    options:
    - Fraksi PKS
    - Harokah
    - Inspirasi
    - Kiprah Kami
    - Oase
    - Pilkada
    - Ragam
    - Seputar Boyolali
    - Seputar PKS
    - Topik Pilihan
  - label: Tag (opsional)
    name: tags
    widget: list
    required: false
    default: []
  - label: Gambar sampul
    name: image
    widget: image
    required: false
  - label: Keterangan gambar
    name: image_caption
    widget: string
    required: false
  - label: Ringkasan singkat (opsional)
    name: description
    widget: text
    required: false
  - label: Isi
    name: body
    widget: markdown
