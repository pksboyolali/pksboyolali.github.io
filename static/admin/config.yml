# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# =====================================================================
#  Admin CMS (Sveltia CMS). "repo" di bawah sudah menunjuk ke repositori situs ini.
#  Masuk di https://ALAMAT-SITUS/admin/ memakai token GitHub (lihat README).
#  Urutan menu samping admin mengikuti urutan "collections" di bawah.
# =====================================================================
backend:
  name: github
  repo: pksboyolali/pksboyolali.github.io
  branch: main
  # Hanya masuk dengan token. Tombol "Sign in with GitHub" dimatikan karena
  # tanpa server OAuth tersendiri tombol itu pasti gagal (lihat PANDUAN-PASANG 6d).
  # Hapus baris di bawah ini setelah OAuth GitHub benar-benar disiapkan.
  auth_methods: [token]
# Alamat domain yang sedang dipakai. Harus persis sama dengan alamat tempat situs
# dibuka, karena Sveltia memakai "origin" dari site_url untuk menyusun alamat gambar.
# Bila nanti pindah ke boyolali.pks.id, ubah kedua baris ini juga.
site_url: https://boyolali.pks.my.id
display_url: https://boyolali.pks.my.id
media_folder: static/images/uploads
public_folder: /images/uploads
# Judul dan logo pada halaman masuk admin (menggantikan logo Sveltia).
app_title: Admin DPD PKS Boyolali
logo:
  src: /images/logo-pks.png
  show_in_header: true
collections:
- name: pengaturan
  label: Pengaturan
  icon: settings
  description: Identitas situs, menu, banner beranda, dan gambar "Kunjungi Juga".
  files:
  - name: identitas
    label: Identitas & pengaturan dasar
    file: data/identitas.yaml
    fields:
    - label: Nama situs
      name: nama_situs
      widget: string
      hint: 'Contoh: DPD PKS Boyolali'
    - label: Deskripsi singkat situs
      name: deskripsi
      widget: text
      hint: Tampil di hasil pencarian Google dan saat tautan dibagikan
    - label: Jenis kepengurusan
      name: jenis
      widget: select
      options:
      - label: Pusat
        value: pusat
      - label: Provinsi (DPW)
        value: provinsi
      - label: Kabupaten (DPD)
        value: kabupaten
      - label: Kota (DPD)
        value: kota
    - label: Nama wilayah
      name: wilayah
      widget: string
      hint: 'Tanpa kata Kabupaten/Kota/Provinsi. Contoh: Boyolali'
    - label: Judul header baris 1 (opsional, menimpa otomatis)
      name: judul_baris_1
      widget: string
      required: false
    - label: Judul header baris 2 (opsional, menimpa otomatis)
      name: judul_baris_2
      widget: string
      required: false
    - label: Judul header baris 3 (opsional, menimpa otomatis)
      name: judul_baris_3
      widget: string
      required: false
    - label: Kontak di footer
      name: kontak
      widget: object
      fields:
      - label: Nama kantor
        name: kantor
        widget: string
        required: false
      - label: Alamat
        name: alamat
        widget: string
        required: false
      - label: Telepon
        name: telepon
        widget: string
        required: false
      - label: Email
        name: email
        widget: string
        required: false
      - label: Tautan peta (Google Maps)
        name: peta
        widget: string
        required: false
    - label: Tautan "Website ini bagian dari..." (kosongkan nama untuk menyembunyikan)
      name: induk
      widget: object
      required: false
      fields:
      - label: Nama
        name: nama
        widget: string
        required: false
      - label: Alamat
        name: url
        widget: string
        required: false
    - label: Teks hak cipta di footer (kosongkan untuk otomatis)
      name: teks_hak_cipta
      widget: string
      required: false
    - label: Teks ajakan media sosial di footer (kosongkan untuk otomatis)
      name: teks_sosial
      widget: string
      required: false
    - label: Media sosial (urutan = urutan tampil)
      name: media_sosial
      widget: list
      required: false
      summary: '{{fields.nama}}'
      fields:
      - label: Platform
        name: nama
        widget: select
        options:
        - Youtube
        - Instagram
        - Tiktok
        - X alias Twitter
        - Facebook
        - Telegram
        - WhatsApp
        - Threads
      - label: Alamat akun
        name: url
        widget: string
    - label: Tombol bagikan
      name: bagikan
      widget: object
      fields:
      - label: Di atas artikel (layar lebar)
        name: atas_artikel
        widget: boolean
        default: true
      - label: Di atas halaman statis
        name: atas_halaman
        widget: boolean
        default: false
      - label: Di bawah artikel dan halaman statis
        name: bawah
        widget: boolean
        default: true
      - label: Tombol mengambang di ponsel (artikel)
        name: mengambang_ponsel
        widget: boolean
        default: true
    - label: Alamat artikel baru
      name: alamat_artikel
      widget: object
      summary: maks {{fields.maks_kata}} kata
      fields:
      - label: Jumlah kata paling banyak
        name: maks_kata
        widget: number
        value_type: int
        min: 2
        max: 20
        default: 8
      - label: Panjang paling banyak (huruf)
        name: maks_huruf
        widget: number
        value_type: int
        min: 20
        max: 150
        default: 70
