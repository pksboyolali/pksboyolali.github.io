# Pemisah menu: "Pengaturan" di atas, isi situs di bawah.
- divider: true
# Keempat halaman tetap situs. Bentuknya "files": tiap halaman punya isian sendiri,
# jadi formulir Profil Fraksi tidak mengganggu Aspirasi, dan sebaliknya.
- name: halaman_tunggal
  label: Halaman Tunggal
  label_singular: Halaman
  icon: description
  description: Empat halaman tetap situs, masing-masing dengan isiannya sendiri.
  files:
  - name: profil_fraksi
    label: Profil Fraksi
    file: content/pages/profil-fraksi.md
    fields:
    - label: Judul
      name: title
      widget: string
    - label: Alamat halaman (jangan diubah)
      name: url
      widget: hidden
      default: /profil-fraksi/
    - label: Isi (pembuka dan tugas fraksi)
      name: body
      widget: markdown
    - label: Anggota fraksi
      name: anggota
      widget: list
      summary: '{{fields.nama}} — {{fields.dapil}}'
      fields:
      - label: Nama
        name: nama
        widget: string
      - label: Jabatan
        name: jabatan
        widget: string
      - label: Daerah pemilihan
        name: dapil
        widget: string
      - label: Cakupan kecamatan (pisahkan dengan koma)
        name: kecamatan
        widget: string
        required: false
      - label: Komisi
        name: komisi
        widget: string
        required: false
        hint: Isi dengan "—" bila data komisi belum ada.
      - label: Foto
        name: foto
        widget: image
        required: false
        hint: Bila kosong, tampil logo PKS. Ukuran ideal 600 x 800 piksel.
  - name: profil_pengurus
    label: Profil Pengurus
    file: content/pages/profil-pengurus.md
    fields:
    - label: Judul
      name: title
      widget: string
    - label: Alamat halaman (jangan diubah)
      name: url
      widget: hidden
      default: /profil-pengurus/
    - label: Isi (pembuka)
      name: body
      widget: markdown
    - label: Tampilkan kotak cari nama
      name: cari_aktif
      widget: boolean
      default: false
      hint: Biarkan mati bila daftar masih pendek. Bila dinyalakan, pengunjung bisa menyaring nama.
    - label: Susunan pengurus
      name: kelompok
      widget: list
      summary: '{{fields.nama}}'
      fields:
      - label: Nama kelompok
        name: nama
        widget: string
      - label: Pengurus
        name: pengurus
        widget: list
        required: false
        summary: '{{fields.nama}} — {{fields.jabatan}}'
        fields:
        - label: Nama
          name: nama
          widget: string
        - label: Jabatan
          name: jabatan
          widget: string
      - label: Komisi / Biro (bila ada)
        name: unit
        widget: list
        required: false
        summary: '{{fields.nama}}'
        fields:
        - label: Nama komisi / biro
          name: nama
          widget: string
        - label: Pengurus
          name: pengurus
          widget: list
          summary: '{{fields.nama}} — {{fields.jabatan}}'
          fields:
          - label: Nama
            name: nama
            widget: string
          - label: Jabatan
            name: jabatan
            widget: string
  - name: aspirasi
    label: Aspirasi
    file: content/pages/aspirasi.md
    fields:
    - label: Judul
      name: title
      widget: string
    - label: Alamat halaman (jangan diubah)
      name: url
      widget: hidden
      default: /aspirasi/
    - label: Isi
      name: body
      widget: markdown
    - label: Alamat pengiriman formulir
      name: form_action
      widget: string
      required: false
      hint: Tempel URL Web App Apps Script yang berakhiran /exec. Selama kosong,
        formulir ditampilkan tetapi tombol Kirim dimatikan dan muncul nomor kontak.
    - label: Tampilkan isian NIK
      name: nik_tampil
      widget: boolean
      default: false
      required: false
      hint: Biarkan mati untuk sekarang. Nyalakan bila atasan meminta NIK
        dikumpulkan; kolomnya sudah tersedia di Sheets sehingga tidak perlu
        mengubah skrip.
    - label: Isian tambahan formulir
      name: isian
      widget: list
      label_singular: Isian
      summary: '{{fields.label}} — {{fields.kunci}}'
      required: false
      hint: >-
        Nama, nomor HP, email, kecamatan, dan desa/kelurahan sudah tetap dan
        tidak perlu ditambah di sini. Tambahkan isian di sini bila ingin
        menambah atau mengubah pertanyaan. Kolom baru otomatis dibuat di
        Sheets — skrip Apps Script tidak perlu diubah.
      fields:
      - label: Kunci (huruf kecil, tanpa spasi)
        name: kunci
        widget: string
        hint: Nama isian sekaligus penanda data. Contoh — pekerjaan, alasan, rt_rw.
      - label: Label yang tampil
        name: label
        widget: string
      - label: Jenis isian
        name: jenis
        widget: select
        default: teks
        options:
        - label: Teks satu baris
          value: teks
        - label: Teks panjang
          value: panjang
        - label: Email
          value: email
        - label: Nomor telepon
          value: telepon
        - label: Angka saja
          value: angka
        - label: Pilihan (dropdown)
          value: pilihan
      - label: Wajib diisi
        name: wajib
        widget: boolean
        default: false
        required: false
      - label: Lebar isian
        name: lebar
        widget: select
        default: penuh
        options:
        - label: Penuh
          value: penuh
        - label: Setengah
          value: setengah
      - label: Daftar pilihan
        name: pilihan
        widget: list
        required: false
        hint: Hanya dipakai bila jenis isian Pilihan (dropdown).
        field:
          label: Pilihan
          name: pilihan
          widget: string
      - label: Teks bantuan
        name: bantuan
        widget: string
        required: false
        hint: Tampil kecil di bawah isian. Boleh dikosongkan.
  - name: gabung
    label: Gabung PKS
    file: content/pages/gabung.md
    fields:
    - label: Judul
      name: title
      widget: string
    - label: Alamat halaman (jangan diubah)
      name: url
      widget: hidden
      default: /gabung/
    - label: Isi
      name: body
      widget: markdown
    - label: Alamat pengiriman formulir
      name: form_action
      widget: string
      required: false
      hint: Sama seperti halaman Aspirasi — satu URL Apps Script dipakai untuk
        kedua formulir. Selama kosong, tombol Kirim dimatikan.
    - label: Tampilkan isian NIK
      name: nik_tampil
      widget: boolean
      default: false
      required: false
      hint: Biarkan mati untuk sekarang. Nyalakan bila NIK memang diperlukan.
    - label: Isian tambahan formulir
      name: isian
      widget: list
      label_singular: Isian
      summary: '{{fields.label}} — {{fields.kunci}}'
      required: false
      hint: >-
        Nama, nomor HP, email, kecamatan, dan desa/kelurahan sudah tetap dan
        tidak perlu ditambah di sini. Tambahkan isian di sini bila ingin
        menambah atau mengubah pertanyaan. Kolom baru otomatis dibuat di
        Sheets — skrip Apps Script tidak perlu diubah.
      fields:
      - label: Kunci (huruf kecil, tanpa spasi)
        name: kunci
        widget: string
        hint: Nama isian sekaligus penanda data. Contoh — pekerjaan, alasan, rt_rw.
      - label: Label yang tampil
        name: label
        widget: string
      - label: Jenis isian
        name: jenis
        widget: select
        default: teks
        options:
        - label: Teks satu baris
          value: teks
        - label: Teks panjang
          value: panjang
        - label: Email
          value: email
        - label: Nomor telepon
          value: telepon
        - label: Angka saja
          value: angka
        - label: Pilihan (dropdown)
          value: pilihan
      - label: Wajib diisi
        name: wajib
        widget: boolean
        default: false
        required: false
      - label: Lebar isian
        name: lebar
        widget: select
        default: penuh
        options:
        - label: Penuh
          value: penuh
        - label: Setengah
          value: setengah
      - label: Daftar pilihan
        name: pilihan
        widget: list
        required: false
        hint: Hanya dipakai bila jenis isian Pilihan (dropdown).
        field:
          label: Pilihan
          name: pilihan
          widget: string
      - label: Teks bantuan
        name: bantuan
        widget: string
        required: false
        hint: Tampil kecil di bawah isian. Boleh dikosongkan.

