{{- $img := partial "func/thumb.html" . -}}
<article class="mb-6 flex flex-col md:flex-row items-start group bg-pks-white border border-pks-black-50 rounded-2xl shadow-lg hover:scale-[1.03] transition-transform duration-300 hover:cursor-pointer">
  <a href="{{ .RelPermalink }}" class="block w-full md:w-auto md:inline-block shrink-0">
    <img src="{{ $img }}" alt="{{ .Title }}" loading="lazy" class="w-full md:w-60 h-60 md:h-40 object-cover rounded-2xl shrink-0">
  </a>
  <div class="entry-content p-4">
    <header>
      <a href="{{ .RelPermalink }}" class="no-underline! mb-2 block">
        <h2 class="entry-title font-semibold text-xl text-pks-black group-hover:text-pks-orange transition-colors duration-300">{{ .Title }}</h2>
      </a>
      {{ partial "entry-meta.html" (dict "p" . "single" false) }}
    </header>
  </div>
</article>
