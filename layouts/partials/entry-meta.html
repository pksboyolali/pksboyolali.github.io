{{- /* dict: p (halaman), single (true di halaman artikel/halaman statis: tampilkan ikon kalender) */ -}}
{{- $p := .p -}}
<div class="entry-meta text-xs text-pks-black-300 flex flex-row items-center gap-2">
  {{- if .single }}
  <svg class="text-pks-orange w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg>
  {{- end }}
  <time class="{{ if .single }}is-single {{ end }}publish-date" data-pagefind-meta="date[datetime]" datetime="{{ $p.Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ $p.Date.Format "02-01-2006" }}</time>
</div>
